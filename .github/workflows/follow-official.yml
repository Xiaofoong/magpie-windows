name: Follow official Magpie and publish Windows WorkBuddy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/follow-official.yml'
      - 'release.py'
      - 'workbuddy.patch'
      - 'tests/windows-ui.test.cjs'
  schedule:
    - cron: '2-57/5 * * * *'

permissions:
  contents: read

concurrency:
  group: magpie-windows-workbuddy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      core: ${{ steps.plan.outputs.core }}
      tag: ${{ steps.plan.outputs.tag }}
      winver: ${{ steps.plan.outputs.winver }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 release.py plan "$REPO"

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out upstream and apply the WorkBuddy changes
        env:
          CORE: ${{ needs.check.outputs.core }}
        run: |
          python3 release.py retry git clone --depth 1 --branch "$CORE" https://github.com/yetone/magpie.git upstream
          python3 release.py retry git -C upstream fetch --no-tags --depth 1 origin refs/tags/v0.1.3908
          git -C upstream apply --3way ../workbuddy.patch
          git -C upstream diff --cached --check
      - name: Verify Windows update labels and migration text
        run: |
          node --check upstream/internal/gui/assets/app.js
          node --test tests/windows-ui.test.cjs
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: upstream/go.mod
          cache-dependency-path: upstream/go.sum
      - name: Download Go dependencies
        working-directory: upstream
        run: python3 ../release.py retry go mod download
      - name: Test desktop account transfer and update verification
        working-directory: upstream
        run: >-
          go test -tags nogui ./internal/gui ./internal/plugin ./internal/update
          -run '^Test(WorkBuddy(Import|Export|Update|Executable).*|FlatAndDomesticFormats|Import(FormatsAndTimeUnits|RejectsMismatchAndUntrustedDomain|PreviewIsReadOnlyCommitKeepsDuplicates|PartialFailureDoesNotLeakOrLoseOthers|NewUIDKeepsExistingSignIn))$'
          -count=1
      - name: Check CLI route parity against upstream
        run: python3 release.py check-parity upstream
      - name: Build the Windows editions
        working-directory: upstream
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
          WINVER: ${{ needs.check.outputs.winver }}
        run: |
          make release-windows VERSION="$TAG" WINVER="$WINVER" \
            LDFLAGS="-s -w -X main.version=$TAG -X github.com/yetone/magpie/internal/update.workBuddyReleaseRepo=$REPO"
          python3 ../release.py package . ../dist "$TAG" "$REPO"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-workbuddy
          path: dist/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [check, build]
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-workbuddy
          path: dist
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
          CORE: ${{ needs.check.outputs.core }}
        run: |
          python3 release.py retry gh api "repos/$REPO/releases?per_page=100" > releases.json
          existing=$(jq -r --arg tag "$TAG" '[.[] | select(.tag_name == $tag)] | first | if . == null then "absent" elif .draft then "draft" else "published" end' releases.json)
          case "$existing" in
            absent)
              printf 'Core %s. Includes WorkBuddy account JSON import and export.\n\nhttps://github.com/yetone/magpie/releases/tag/%s\n' "$CORE" "$CORE" > notes.txt
              gh release create "$TAG" --repo "$REPO" --target "$GITHUB_SHA" --draft --title "Magpie Windows $CORE" --notes-file notes.txt
              ;;
            draft) ;;
            *) exit 1 ;;
          esac
          (cd dist && sha256sum --check SHA256SUMS.txt)
          python3 release.py retry gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          python3 release.py verify "$REPO" "$TAG" dist
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest --title "Magpie Windows $CORE"
