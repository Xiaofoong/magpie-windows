name: Follow official Magpie and publish Windows WorkBuddy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/follow-official.yml'
      - 'release.py'
      - 'workbuddy.patch'
      - 'tests/windows-ui.test.cjs'
      - 'tests/renewable-import-ui.test.cjs'
      - 'tests/test_release.py'
      - 'installer/**'
  schedule:
    - cron: '2-57/5 * * * *'

permissions:
  contents: read

concurrency:
  group: magpie-windows-workbuddy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.plan.outputs.build }}
      core: ${{ steps.plan.outputs.core }}
      published: ${{ steps.plan.outputs.published }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test release selection and patch conflicts
        if: github.event_name == 'push'
        run: python3 -m unittest discover -s tests -p test_release.py
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VALIDATE_CURRENT: ${{ github.event_name == 'push' }}
        run: python3 release.py plan "$REPO"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      publish: ${{ steps.prepare.outputs.publish }}
      core: ${{ steps.prepare.outputs.core }}
      tag: ${{ steps.prepare.outputs.tag }}
      winver: ${{ steps.prepare.outputs.winver }}
      ready: ${{ steps.prepare.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare the newest compatible official stable core
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          CORE: ${{ needs.check.outputs.core }}
          PUBLISHED: ${{ needs.check.outputs.published }}
        run: python3 release.py prepare upstream "$CORE" "$PUBLISHED"
      - name: Verify Windows update labels and migration text
        if: steps.prepare.outputs.ready == 'true'
        run: |
          node --check upstream/internal/gui/assets/app.js
          node --test tests/*.test.cjs
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        if: steps.prepare.outputs.ready == 'true'
        with:
          go-version-file: upstream/go.mod
          cache-dependency-path: upstream/go.sum
      - name: Download Go dependencies
        if: steps.prepare.outputs.ready == 'true'
        working-directory: upstream
        run: python3 ../release.py retry go mod download
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: steps.prepare.outputs.ready == 'true'
        with:
          bun-version: 1.4.2
      - name: Test desktop account transfer and update verification
        if: steps.prepare.outputs.ready == 'true'
        working-directory: upstream
        run: |
          go test -json -tags nogui ./internal/gui ./internal/plugin ./internal/update \
            -run '^Test(WorkBuddy(Import|Export|Update|Executable|SavedAccounts).*|FlatAndDomesticFormats|Import(FormatsAndTimeUnits|RejectsMismatchAndUntrustedDomain|PreviewIsReadOnlyCommitKeepsDuplicates|PartialFailureDoesNotLeakOrLoseOthers|NewUIDKeepsExistingSignIn)|ZeroedPluginAuthReadFromBackup|PluginAuthSyncedBeforeRename)$' \
            -count=1 | tee account-tests.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          events = [json.loads(line) for line in Path('account-tests.json').read_text().splitlines()]
          skipped = [event['Test'] for event in events if event['Action'] == 'skip' and 'Test' in event]
          required = {'TestWorkBuddySavedAccountsSurviveHostRestart',
                      'TestImportNewUIDKeepsExistingSignIn',
                      'TestZeroedPluginAuthReadFromBackup', 'TestPluginAuthSyncedBeforeRename'}
          passed = {event['Test'] for event in events if event['Action'] == 'pass' and 'Test' in event}
          if skipped or required - passed:
              raise SystemExit(f'Account persistence verification incomplete: skipped={skipped}, missing={sorted(required - passed)}')
          print('Account save, restart, backup recovery and durable-write checks executed and passed.')
          PY
      - name: Check CLI route parity against upstream
        if: steps.prepare.outputs.ready == 'true'
        run: python3 release.py check-parity upstream
      - name: Build the Windows editions
        if: steps.prepare.outputs.ready == 'true'
        working-directory: upstream
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.prepare.outputs.tag }}
          WINVER: ${{ steps.prepare.outputs.winver }}
        run: |
          make release-windows VERSION="$TAG" WINVER="$WINVER" \
            LDFLAGS="-s -w -X main.version=$TAG -X github.com/yetone/magpie/internal/update.workBuddyReleaseRepo=$REPO"
          python3 ../release.py package . ../dist "$TAG" "$REPO"
          (cd ../dist && sha256sum --check SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.prepare.outputs.ready == 'true'
        with:
          name: windows-programs
          path: dist/
          if-no-files-found: error
          retention-days: 3

  installer:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-programs
          path: dist
      - name: Build x64 and ARM64 installers
        env:
          CORE: ${{ needs.build.outputs.core }}
          WINVER: ${{ needs.build.outputs.winver }}
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw 'Inno Setup compiler is missing' }
          foreach ($line in Get-Content dist/SHA256SUMS.txt) {
            $hash, $name = $line -split '  ', 2
            if ((Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) {
              throw "Downloaded program checksum failed for $name"
            }
          }
          foreach ($arch in @('amd64', 'arm64')) {
            & $compiler "/DArch=$arch" "/DAppVersion=$($env:CORE.TrimStart('v'))" "/DWindowsVersion=$env:WINVER" installer/magpie.iss
            if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed for $arch" }
          }
          python release.py seal dist
          if ($LASTEXITCODE -ne 0) { throw 'Installer file verification failed' }
      - name: Verify installation and retained records
        run: ./installer/test-install.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: needs.build.outputs.publish == 'true'
        with:
          name: windows-workbuddy
          path: dist/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [build, installer]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-workbuddy
          path: dist
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          CORE: ${{ needs.build.outputs.core }}
        run: |
          python3 release.py retry gh api "repos/$REPO/releases?per_page=100" > releases.json
          existing=$(jq -r --arg tag "$TAG" '[.[] | select(.tag_name == $tag)] | first | if . == null then "absent" elif .draft then "draft" else "published" end' releases.json)
          case "$existing" in
            absent)
              printf 'Core %s. Includes Windows setup installers and WorkBuddy account JSON import and export.\n\nDownload Magpie-Windows-x64-Setup.exe for Intel/AMD PCs, or Magpie-Windows-ARM64-Setup.exe for ARM PCs.\n\nhttps://github.com/yetone/magpie/releases/tag/%s\n' "$CORE" "$CORE" > notes.txt
              gh release create "$TAG" --repo "$REPO" --target "$GITHUB_SHA" --draft --title "Magpie Windows $CORE" --notes-file notes.txt
              ;;
            draft) ;;
            *) exit 1 ;;
          esac
          (cd dist && sha256sum --check SHA256SUMS.txt)
          python3 release.py retry gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          python3 release.py verify "$REPO" "$TAG" dist
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest --title "Magpie Windows $CORE"
